[package]
name = "bamdude-bridge"
version = "0.1.0"
description = "Desktop bridge between a Windows workstation and a BamDude server"
authors = ["BamDude contributors"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/kainpl/bamdude-bridge"
edition = "2021"
rust-version = "1.77"

# ⚠️ Minor versions below are a first pass written before a toolchain existed
# on this machine — nothing here has been resolved by cargo yet. Expect the
# first `cargo build` to move some of them; that is the point at which they
# become facts rather than guesses.

[lib]
# Tauri wants the app's logic in a lib so the mobile targets can link it, and
# so integration tests can reach it. `farm_client_url` is unit-tested through
# this crate.
name = "bamdude_bridge_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ⚠️ `image-png` is what lets the tray decode its own icon at runtime. Without
# it `Image::from_bytes` does not exist and the tray silently falls back to
# the window icon — which is the plate this change exists to stop showing.
tauri = { version = "2", features = ["tray-icon", "image-png"] }

# A protocol launch starts a NEW process with the URL in argv. Without this,
# every file sent from the slicer would open a second copy of the app.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# A handover happens with no one watching, in a release build that has no
# console (`windows_subsystem = "windows"`). Without a log on disk, a failed
# upload is indistinguishable from one that never started — which is exactly
# how the first real handover failed: silently, with nothing to read.
log = "0.4"
tauri-plugin-log = "2"

# ⚠️ NOT tauri-plugin-notification. The plugin wraps this same crate but
# exposes no duration at all, and 7 seconds was too quick to catch. Going
# direct costs nothing — it was already in the tree as the plugin's own
# dependency — and buys the two lengths Windows actually offers.

# Decoding the PNG the server renders. No default features: we need PNG in and
# nothing else, and every extra format is bytes in a binary people download.
image = { version = "0.25", default-features = false, features = ["png"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# The queued raster travels as base64 inside the poll's JSON answer. A second
# request for the bytes would double the round trips on the one path that runs
# every few seconds all day.
base64 = "0.22"

# The installation id, generated once and then never again. ⚠️ Regenerating it
# orphans the paired device row on the server and the printer silently stops
# getting work — see config::installation_id.
uuid = { version = "1", features = ["v4"] }

# The whole reason parsing is delicate — see farm_client_url.rs.
percent-encoding = "2"

# rustls rather than the platform stack: one behaviour to reason about, and no
# schannel-vs-openssl difference between a dev box and a CI runner.
reqwest = { version = "0.12", default-features = false, features = [
    "multipart",
    "json",
    "rustls-tls",
] }
async-trait = "0.1"
# USB serial to the label printer. Blocking by design; the transport hands
# the port to a blocking thread per operation rather than running one of its
# own for the life of the app.
serialport = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }

# Self-update. The installer path is the official plugin; the portable path is
# ours (see src/update/portable.rs) and needs the verification primitives.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Remembers how big the window was left. ⚠️ Chosen over doing it by hand for
# one reason worth writing down: it checks a restored position against the
# monitors that are actually connected, so an undocked laptop does not get its
# window placed off-screen where it cannot be reached.
tauri-plugin-window-state = "2"

# ⚠️ Portable updates verify with the SAME key the plugin uses, read out of the
# embedded tauri.conf.json — one trust root, not two.
minisign-verify = "0.2"
semver = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
# Registry access for the two keys that make BambuStudio offer the button and
# make Windows route the URL back to us.
winreg = "0.52"

# Toasts, with control over how long they stay.
tauri-winrt-notification = "0.7"

[profile.release]
# A bridge is not a hot loop; size matters more than the last few percent of
# speed, because this is a binary people download.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
