name: Release

# Builds the two things a user can download and attaches them to the tag's
# GitHub release:
#
#   - an NSIS installer, for people who want Start Menu entries and an
#     uninstaller;
#   - a portable .zip, for people who want neither. Registration is a button
#     inside the app rather than installer work, so the portable build is not
#     a lesser version — it does everything the installed one does.
#
# Windows-only, like CI: the registry module is cfg(windows), so a Linux
# runner would report green on code that never compiled.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Needed by the release step to attach assets to the tag.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the branch guard below asks which branches contain
          # this commit, which a shallow clone cannot answer.
          fetch-depth: 0

      # Encodes the release rule rather than trusting everyone to remember it:
      # stable ships from main, betas from dev. A stable tag sitting on a
      # branch main has not seen means the artifacts do not match what main
      # claims to be — and tags are immutable, so the only repair is burning a
      # version number.
      - name: Stable tags come from main, betas from dev
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git fetch origin main dev --quiet 2>/dev/null || true
          on_branch() {
            git branch --remotes --contains "$GITHUB_SHA" \
              | sed 's/^[* ]*//' | grep -qx "origin/$1"
          }
          # A SemVer pre-release is anything carrying a suffix after the
          # version core — `-beta.1`, `-rc.2`, whatever. Matching on the dash
          # rather than on one spelling means a future `-rc` needs no change
          # here, and cannot silently be treated as stable.
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            on_branch dev || { echo "pre-release tag ${GITHUB_REF_NAME} is not on dev" >&2; exit 1; }
          else
            on_branch main || { echo "stable tag ${GITHUB_REF_NAME} is not on main" >&2; exit 1; }
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - name: Install frontend dependencies
        run: npm ci

      # A tag push does not run ci.yml — that one triggers on branches — so the
      # checks run here too rather than shipping something unverified.
      - name: Typecheck frontend
        run: npm run typecheck

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test --lib

      # ⚠️ The version lives in tauri.conf.json and the tag lives in git, and
      # nothing keeps them honest. Shipping v0.2.0 built from a tree that still
      # says 0.1.0 produces artifacts whose filenames and About box disagree
      # with the release they hang under — and nobody notices until a bug
      # report cites a version that was never built.
      - name: Tag must match the version in tauri.conf.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          declared=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "tag $GITHUB_REF_NAME says $tagged, tauri.conf.json says $declared" >&2
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_ENV"

      # ⚠️ The notes are not decoration any more: `latest.json` carries them, so
      # this text is what an installed copy shows before somebody agrees to
      # update. Notes left over from the previous version would be published as
      # this one's — checked here rather than noticed by a user.
      - name: Release notes must be written for this version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          declared=$(head -1 packaging/release-notes.md | sed -n 's/^version:[[:space:]]*//p')
          tagged="${GITHUB_REF_NAME#v}"
          if [ -z "$declared" ]; then
            echo "packaging/release-notes.md must start with 'version: X.Y.Z'" >&2
            exit 1
          fi
          if [ "$declared" != "$tagged" ]; then
            echo "release notes are written for $declared, but the tag says $tagged" >&2
            exit 1
          fi
          # The header line is a guard, not prose — strip it from what ships.
          tail -n +2 packaging/release-notes.md | sed '/./,$!d' > release-body.md

      - name: Resolve version for a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_ENV"

      # ⚠️ The signing key is what every installed copy checks against. Without
      # it in the environment, `createUpdaterArtifacts` produces artifacts the
      # updater will refuse — and the failure appears on the USER's machine, one
      # release later, not here.
      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm run tauri build

      # Tauri names the installer after the product, which is fine on a
      # download page and awkward in a URL. Rename to match how BamDude's own
      # installer is published, so both read the same way.
      - name: Stage artifacts
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null

          # Matched on the version rather than taking the first file found. A
          # CI checkout is clean so today there is exactly one — but "first of
          # whatever is lying around" is how a stale artifact from an earlier
          # build gets published under a new version's name, and the failure
          # would be a correct-looking release containing the wrong binary.
          $setup = Get-ChildItem "target/release/bundle/nsis/*_${env:version}_x64-setup.exe"
          if (-not $setup) { throw "no NSIS installer for version $env:version was produced" }
          if ($setup.Count -gt 1) { throw "more than one installer matched version $env:version" }
          Copy-Item $setup.FullName "dist-release/bamdude-bridge-$env:version-windows-x64-setup.exe"

          # The portable build is the same binary, plus the instructions that
          # would otherwise have been the installer's job to imply.
          New-Item -ItemType Directory -Force portable-staging | Out-Null
          Copy-Item "target/release/bamdude-bridge.exe" portable-staging/
          Copy-Item "packaging/portable-README.txt" portable-staging/README.txt
          Copy-Item "LICENSE" portable-staging/

          # ⚠️ The marker is what tells a running copy it is portable. The
          # executable is byte-identical to the installed one, so without this
          # file beside it the app would take the installer path and try to
          # overwrite something in Program Files.
          # ⚠️ Not a here-string: PowerShell wants its closing '@ in column 0,
          # which cannot exist inside a YAML block scalar. An array of lines
          # says the same thing and survives the indentation.
          Set-Content -Path "portable-staging/portable.bamdude" -Value @(
            'This file marks a portable BamDude Bridge. Keep it beside the executable:',
            'without it the app cannot tell it is portable, and self-updating will refuse.'
          )

          # ⚠️ A second manifest INSIDE the archive. The signature says "we
          # built this zip"; it does not say what is in it. This binds the
          # version, the architecture and the exact executable, so a stale but
          # correctly signed archive cannot be served for a version it is not.
          $exeHash = (Get-FileHash "portable-staging/bamdude-bridge.exe" -Algorithm SHA256).Hash.ToLower()
          $manifest = [ordered]@{
            schema_version    = 1
            version           = $env:version
            arch              = 'x64'
            executable        = 'bamdude-bridge.exe'
            executable_sha256 = $exeHash
          }
          $manifest | ConvertTo-Json | Set-Content -Path "portable-staging/portable-update.json" -Encoding utf8

          Compress-Archive -Path portable-staging/* `
            -DestinationPath "dist-release/bamdude-bridge-$env:version-windows-x64-portable.zip" -Force

          # Signed with the same key the plugin's own artifacts carry — one
          # trust root. The app reads the public half out of its embedded
          # config, so a `.sig` from anywhere else fails verification.
          npx --yes @tauri-apps/cli signer sign `
            --private-key $env:TAURI_SIGNING_PRIVATE_KEY `
            --password '' `
            "dist-release/bamdude-bridge-$env:version-windows-x64-portable.zip"

          # Unversioned aliases so a website or wiki can link one URL that
          # survives version bumps, the same way the BamDude installer does.
          Copy-Item "dist-release/bamdude-bridge-$env:version-windows-x64-setup.exe" `
            "dist-release/bamdude-bridge-windows-x64-setup.exe"
          Copy-Item "dist-release/bamdude-bridge-$env:version-windows-x64-portable.zip" `
            "dist-release/bamdude-bridge-windows-x64-portable.zip"

          # ⚠️ `latest.json` is the whole update mechanism: every installed copy
          # polls THIS file at the fixed `releases/latest/download/` URL. The
          # installer's own signature is produced by the build beside the
          # setup.exe as a `.sig`; it goes in here, not into the release.
          #
          # The notes are the release body, filled in by the publish step
          # below — written once, on the release, rather than kept as a second
          # changelog that drifts.
          $setupSig = Get-ChildItem "target/release/bundle/nsis/*_${env:version}_x64-setup.exe.sig" |
            Select-Object -First 1
          if (-not $setupSig) { throw "the installer was not signed — is TAURI_SIGNING_PRIVATE_KEY set?" }

          $latest = [ordered]@{
            version   = "$env:version"
            notes     = ''
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content $setupSig.FullName -Raw).Trim()
                url       = "https://github.com/${{ github.repository }}/releases/download/v$env:version/bamdude-bridge-$env:version-windows-x64-setup.exe"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 5 | Set-Content -Path "dist-release/latest.json" -Encoding utf8

          Get-ChildItem dist-release | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bamdude-bridge-${{ env.version }}
          path: dist-release/*
          if-no-files-found: error

      # ⚠️ This step CREATES the release when it does not exist yet, and
      # without the flag it would create a full one — which then displaces the
      # current stable as the repository's "Latest". Decide from the tag.
      - name: Classify tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: tagkind
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist-release/*
          fail_on_unmatched_files: true
          prerelease: ${{ steps.tagkind.outputs.prerelease }}
          body_path: release-body.md

      # ⚠️ After the release exists, because the notes ARE its body — which
      # the step above may have just generated. Writing them into the manifest
      # earlier would publish an empty `notes` and leave every user looking at
      # "a new version is available" with nothing saying what changed.
      - name: Put the release notes into latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)
          jq --arg notes "$body" '.notes = $notes' dist-release/latest.json > latest.tmp
          mv latest.tmp dist-release/latest.json
          gh release upload "$GITHUB_REF_NAME" dist-release/latest.json --clobber
